
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiger Empire Admin Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #101010;
      color: white;
      padding: 20px;
      max-width: 650px;
      margin: auto;
    }
    h1 { color: #39ff14; }
    input, select, textarea, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 6px;
      font-size: 16px;
    }
    button {
      background: #39ff14;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    .panel {
      background: #222;
      padding: 16px;
      margin: 16px 0;
      border-radius: 10px;
    }
    #status { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>🐅 TIGER EMPIRE</h1>
  <h2>Admin Dashboard</h2>
  <p>Publish photos, videos, and news.</p>

  <div class="panel">
    <label>Admin password</label>
    <input id="password" type="password"
      placeholder="Enter your admin password">

    <label>Post type</label>
    <select id="type">
      <option value="photo">Photo</option>
      <option value="video">Video</option>
      <option value="news">News</option>
    </select>

    <label>Title or news headline</label>
    <input id="title" placeholder="Enter a title">

    <label>Cloudinary photo or video URL</label>
    <input id="url" placeholder="Paste Cloudinary URL">

    <label>News content (optional)</label>
    <textarea id="content" rows="4"
      placeholder="Write your news here"></textarea>

    <button id="publish" onclick="publishPost()">
      Publish Post
    </button>
    <p id="status" role="status"></p>
  </div>

  <script>
    async function publishPost() {
      const password =
        document.getElementById("password").value;
      const type = document.getElementById("type").value;
      const title =
        document.getElementById("title").value.trim();
      const url =
        document.getElementById("url").value.trim();
      const content =
        document.getElementById("content").value.trim();
      const status = document.getElementById("status");
      const button = document.getElementById("publish");

      if (!password || !title) {
        status.textContent =
          "Enter your admin password and a title.";
        return;
      }

      if (type !== "news" && !url) {
        status.textContent =
          "Paste the Cloudinary URL for your photo or video.";
        return;
      }

      if (type === "news" && !content) {
        status.textContent =
          "Please write the news content.";
        return;
      }

      button.disabled = true;
      status.textContent = "Publishing...";

      try {
        const response = await fetch(
          "/.netlify/functions/published-post",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              password,
              type,
              title,
              url,
              content
            })
          }
        );

        const result = await response.json();

        if (!response.ok) {
          throw new Error(
            result.error || "Publishing failed."
          );
        }

        status.textContent =
          "Success! Your post was saved. The website gallery must also read the posts file to display it.";

        document.getElementById("title").value = "";
        document.getElementById("url").value = "";
        document.getElementById("content").value = "";
      } catch (error) {
        status.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    }
    
    async function savePlayer() {
      const status = document.getElementById("playerStatus");
      const password = document.getElementById("password").value;

      const player = {
        password: password,
        action: "save",
        name: document.getElementById("playerName").value.trim(),
        number: document.getElementById("playerNumber").value.trim(),
        position: document.getElementById("playerPosition").value,
        age_group: document.getElementById("playerAgeGroup").value,
        photo: document.getElementById("playerPhoto").value.trim(),
        goals: document.getElementById("playerGoals").value,
        assists: document.getElementById("playerAssists").value,
        appearances: document.getElementById("playerAppearances").value
      };

      if (!password || !player.name || !player.position || !player.age_group) {
        status.textContent = "Enter the admin password, player name, position and age group.";
        return;
      }

      for (const field of ["goals", "assists", "appearances"]) {
        if (!Number.isInteger(Number(player[field])) || Number(player[field]) < 0) {
          status.textContent = "Statistics must be whole numbers of zero or more.";
          return;
        }
      }

      status.textContent = "Saving player...";
      try {
        const response = await fetch("/.netlify/functions/published-player", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(player)
        });

        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Could not save player.");

        status.textContent = "Player profile saved successfully!";
      } catch (error) {
        status.textContent = error.message || "Could not save player.";
      }
    }

  </script>
</body>
</html>
